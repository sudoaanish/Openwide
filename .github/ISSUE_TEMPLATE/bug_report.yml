name: Bug report
description: Report a reproducible playback, fitting, or interface problem.
title: '[Bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Openwide version
      placeholder: '0.1.1'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: 'Chrome version, Windows version, monitor resolution'
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Player and selected mode
      placeholder: 'YouTube, Fill'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include fullscreen state, border settings, and other enabled video extensions when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots
      description: Remove account information, tokens, private media URLs, and private server addresses before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Report contents
      options:
        - label: I have removed private information from this report.
          required: true
